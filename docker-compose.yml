services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d transactions"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.3.0
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "${S3_BIND_ADDRESS:-127.0.0.1}:${S3_HOST_PORT:-4567}:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -Eq '\"s3\": \"(available|running)\"'"]
      interval: 3s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

  pipeline:
    build: .
    profiles: ["pipeline"]
    environment:
      DATABASE_URL: postgresql://pipeline:${POSTGRES_PASSWORD:-pipeline}@postgres:5432/transactions
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: transactions
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      S3_PREFIX: ${S3_PREFIX:-transactions/}
      DATA_DIRECTORY: /app/data/generated
      SIMULATE_INSERT_FAILURES: ${SIMULATE_INSERT_FAILURES:-0}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  tests:
    build: .
    command: ["python", "-m", "pytest", "-q"]
    environment:
      DATABASE_URL: postgresql://pipeline:${POSTGRES_PASSWORD:-pipeline}@postgres:5432/transactions
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: transactions
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      S3_PREFIX: transactions/
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:
  grafana_data:
